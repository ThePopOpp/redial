<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReDial — 3D phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#e8e8ea;--ink:#1a1b1c;--dim:#6a6b6b;--linec:rgba(0,0,0,.14);
  --violet:#847dff;
}
:root:not([data-theme="light"]){@media (prefers-color-scheme: dark){
  --stage:#0b0c0c;--ink:#f5f5f7;--dim:#6a6b6b;--linec:rgba(255,255,255,.16);}}
:root[data-theme="dark"]{--stage:#0b0c0c;--ink:#f5f5f7;--linec:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--stage);color:var(--ink);
  font-family:'Inter',-apple-system,sans-serif;font-weight:300;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
#stage{position:absolute;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
canvas{display:block}

.hud{position:absolute;left:0;right:0;top:0;padding:22px 24px;pointer-events:none;
  padding-top:calc(22px + env(safe-area-inset-top,0px))}
.hud .nm{font-family:'DM Serif Display',serif;font-size:19px;display:flex;align-items:center;gap:10px}
.hud .lg{width:24px;height:24px;border:1px solid currentColor;border-radius:7px;display:grid;place-items:center;font-size:13px}
.hud .sub{font-size:12.5px;color:var(--dim);margin-top:6px}

.tools{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));
  display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.tools button{
  background:transparent;border:1px solid var(--linec);border-radius:999px;
  padding:9px 17px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;
  backdrop-filter:blur(8px);
}
.tools button:hover{border-color:var(--violet);color:var(--violet)}
.tools button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));
  font-size:12px;color:var(--dim);pointer-events:none;transition:opacity .5s}
.hint.gone{opacity:0}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:40px;text-align:center;
  font-size:15px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>
</head>
<body>

<div id="stage"><canvas id="c"></canvas></div>

<div class="hud">
  <div class="nm"><span class="lg">R</span>ReDial</div>
  <div class="sub">Drag anywhere to rotate · scroll to zoom</div>
</div>

<div class="hint" id="hint">Drag it</div>

<div class="tools">
  <button id="bFront">Front</button>
  <button id="bBack">Back</button>
  <button id="bTilt">Three-quarter</button>
  <button id="bSpin">Auto-spin</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  if (typeof THREE === 'undefined') {
    document.getElementById('stage').innerHTML =
      '<div class="fallback">Three.js could not load. Check the network and reload.</div>';
    return;
  }

  var stage  = document.getElementById('stage');
  var canvas = document.getElementById('c');

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  var scene  = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 0, 6.4);

  var phone = new THREE.Group();
  scene.add(phone);

  // ---------------------------------------------------------------- env map
  // Metal reads black without something to reflect. A cheap gradient
  // environment is enough and costs nothing.
  function envMap(){
    var c = document.createElement('canvas');
    c.width = 512; c.height = 256;
    var g = c.getContext('2d');
    var grd = g.createLinearGradient(0, 0, 0, 256);
    grd.addColorStop(0.00, '#dfe4ec');
    grd.addColorStop(0.30, '#5f666f');
    grd.addColorStop(0.46, '#14171a');
    grd.addColorStop(1.00, '#040506');
    g.fillStyle = grd; g.fillRect(0, 0, 512, 256);
    // a couple of soft highlights so rotation has something to catch
    g.globalAlpha = 0.85;
    ['#ffffff', '#cfd6ff'].forEach(function(col, i){
      var rg = g.createRadialGradient(120 + i * 250, 60 + i * 20, 4, 120 + i * 250, 60 + i * 20, 90);
      rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = rg; g.fillRect(0, 0, 512, 256);
    });
    var tex = new THREE.Texture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    tex.needsUpdate = true;
    var pmrem = new THREE.PMREMGenerator(renderer);
    var rt = pmrem.fromEquirectangular(tex);
    pmrem.dispose(); tex.dispose();
    return rt.texture;
  }
  var env = envMap();
  scene.environment = env;

  // ---------------------------------------------------------------- body
  var W = 1.50, H = 3.08, R = 0.26, D = 0.105;

  function roundedRect(w, h, r){
    var s = new THREE.Shape(), x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y);
    s.lineTo(x + w - r, y);     s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h);     s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r);         s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }

  // A flat rounded rectangle with proper 0..1 UVs. ShapeGeometry generates UVs
  // in shape coordinates, which would leave the texture unmapped, so remap them
  // from position.
  function roundedPlane(w, h, r){
    var geo = new THREE.ShapeGeometry(roundedRect(w, h, r), 24);
    var pos = geo.attributes.position, uv = geo.attributes.uv;
    for (var i = 0; i < pos.count; i++){
      uv.setXY(i, (pos.getX(i) + w / 2) / w, (pos.getY(i) + h / 2) / h);
    }
    uv.needsUpdate = true;
    return geo;
  }

  var bodyGeo = new THREE.ExtrudeGeometry(roundedRect(W, H, R), {
    depth: D, bevelEnabled: true, bevelThickness: 0.018,
    bevelSize: 0.020, bevelSegments: 5, curveSegments: 28
  });
  bodyGeo.center();

  var titanium = new THREE.MeshStandardMaterial({
    color: 0x0a0c0e, metalness: 0.92, roughness: 0.30, envMapIntensity: 1.05
  });
  phone.add(new THREE.Mesh(bodyGeo, titanium));

  // Matte black bezel. A reflective glass sheet over the whole face turns the
  // phone into a mirror of the environment map and hides the screen entirely —
  // the glare is painted into the screen canvas instead, where it's controllable.
  var bezel = new THREE.Mesh(
    roundedPlane(W - 0.030, H - 0.030, R - 0.013),
    new THREE.MeshBasicMaterial({ color: 0x000000 })
  );
  bezel.position.z = D / 2 + 0.009;
  phone.add(bezel);

  // ---------------------------------------------------------------- screen
  var sc = document.createElement('canvas');
  sc.width = 660; sc.height = 1394;   // matches SW/SH so nothing stretches
  var screenTex = new THREE.CanvasTexture(sc);
  screenTex.encoding = THREE.sRGBEncoding;
  screenTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  var SW = W - 0.062, SH = H - 0.062;
  var screen = new THREE.Mesh(
    roundedPlane(SW, SH, R - 0.027),
    new THREE.MeshBasicMaterial({ map: screenTex })
  );
  screen.position.z = D / 2 + 0.013;
  phone.add(screen);

  function drawScreen(){
    var g = sc.getContext('2d'), w = sc.width, h = sc.height;
    var serif = '"DM Serif Display", Georgia, serif';
    var sans  = '"Inter", system-ui, sans-serif';
    var mono  = '"Roboto Mono", monospace';

    g.fillStyle = '#0f1011'; g.fillRect(0, 0, w, h);

    // status bar
    g.fillStyle = '#f5f5f7'; g.font = '600 26px ' + sans;
    g.textAlign = 'left';  g.fillText('9:41', 46, 60);
    g.textAlign = 'right'; g.fillText('▮▮▮  82%', w - 46, 60);

    // dynamic island
    g.fillStyle = '#000';
    roundRect(g, w / 2 - 128, 24, 256, 54, 27); g.fill();
    g.fillStyle = '#5dd39e'; g.beginPath(); g.arc(w / 2 - 92, 51, 8, 0, 6.29); g.fill();
    g.fillStyle = '#5dd39e'; g.font = '500 22px ' + mono;
    g.textAlign = 'center'; g.fillText('00:14', w / 2 + 28, 59);

    // live bar
    g.fillStyle = 'rgba(132,125,255,.14)'; g.fillRect(0, 96, w, 60);
    g.fillStyle = '#847dff'; g.beginPath(); g.arc(60, 126, 7, 0, 6.29); g.fill();
    g.font = '400 20px ' + mono; g.textAlign = 'left';
    g.fillText('O N   T H E   L I N E', 84, 134);
    g.fillStyle = '#9f9fa0'; g.textAlign = 'right'; g.fillText('00:14', w - 46, 134);

    // caller
    g.textAlign = 'left';
    g.fillStyle = '#f5f5f7'; g.font = '400 54px ' + serif;
    g.fillText('(917) 555-0182', 46, 244);
    g.fillStyle = '#9f9fa0'; g.font = '300 24px ' + sans;
    g.fillText('Not in contacts · no spam flag', 46, 286);

    // transcript
    var y = 372;
    y = turn(g, 'A G E N T', '#847dff',
      ['"Hi — you\u2019ve reached Marcus\u2019s', 'assistant. May I ask who\u2019s', 'calling?"'], y, '#f5f5f7');
    y = turn(g, 'C A L L E R', '#6a6b6b',
      ['"Delivery for Marcus, I\u2019m at the', 'gate and the code isn\u2019t working."'], y, '#9f9fa0');
    y = turn(g, 'Y O U   \u2192   A G E N T', '#f0c06a',
      ['Ask which company, and tell', 'them gate code 4417.'], y, '#f0c06a');

    function turn(g, label, labelCol, lines, y, bodyCol){
      g.fillStyle = labelCol; g.font = '400 17px ' + mono;
      g.fillText(label, 46, y);
      g.fillStyle = bodyCol; g.font = '300 27px ' + sans;
      lines.forEach(function(l, i){ g.fillText(l, 46, y + 42 + i * 38); });
      return y + 42 + lines.length * 38 + 34;
    }

    // controls
    var bw = (w - 92 - 28) / 3, by = h - 300;
    ['Insider', 'Audible', 'Directory'].forEach(function(t, i){
      var x = 46 + i * (bw + 14);
      g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 2;
      roundRect(g, x, by, bw, 104, 22); g.stroke();
      g.fillStyle = '#9f9fa0'; g.font = '300 22px ' + sans; g.textAlign = 'center';
      g.fillText(t, x + bw / 2, by + 64);
    });

    g.fillStyle = '#ffffff'; roundRect(g, 46, by + 124, w - 92, 108, 24); g.fill();
    g.fillStyle = '#000'; g.font = '600 30px ' + sans; g.textAlign = 'center';
    g.fillText('Gavel — take the call', w / 2, by + 190);

    g.fillStyle = '#6a6b6b'; g.font = '300 21px ' + sans;
    g.fillText('Do nothing and the agent takes a message.', w / 2, by + 268);

    // home indicator
    g.fillStyle = 'rgba(255,255,255,.34)';
    roundRect(g, w / 2 - 90, h - 34, 180, 9, 5); g.fill();

    // Glass glare, painted rather than reflected. A diagonal sheen plus a
    // vignette reads as glass without obscuring anything under it.
    g.save();
    g.globalCompositeOperation = 'lighter';
    var sheen = g.createLinearGradient(-w * 0.1, 0, w * 1.05, h * 0.72);
    sheen.addColorStop(0.00, 'rgba(255,255,255,0.000)');
    sheen.addColorStop(0.30, 'rgba(255,255,255,0.055)');
    sheen.addColorStop(0.42, 'rgba(210,220,255,0.085)');
    sheen.addColorStop(0.52, 'rgba(255,255,255,0.010)');
    sheen.addColorStop(1.00, 'rgba(255,255,255,0.000)');
    g.fillStyle = sheen; g.fillRect(0, 0, w, h);
    g.restore();

    var vig = g.createRadialGradient(w / 2, h / 2, h * 0.30, w / 2, h / 2, h * 0.68);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.38)');
    g.fillStyle = vig; g.fillRect(0, 0, w, h);

    screenTex.needsUpdate = true;
  }

  function roundRect(g, x, y, w, h, r){
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  drawScreen();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawScreen);

  // ---------------------------------------------------------------- back
  var backPlate = new THREE.Mesh(
    new THREE.ExtrudeGeometry(roundedRect(W - 0.06, H - 0.06, R - 0.02),
      { depth: 0.01, bevelEnabled: false, curveSegments: 28 }),
    new THREE.MeshPhysicalMaterial({
      color: 0x08090b, metalness: 0.35, roughness: 0.40,
      clearcoat: 0.6, clearcoatRoughness: 0.32, envMapIntensity: 0.8
    })
  );
  backPlate.geometry.center();
  backPlate.position.z = -(D / 2 + 0.007);
  phone.add(backPlate);

  // camera island
  var island = new THREE.Mesh(
    new THREE.ExtrudeGeometry(roundedRect(0.62, 0.62, 0.17),
      { depth: 0.034, bevelEnabled: true, bevelThickness: 0.010, bevelSize: 0.010, bevelSegments: 3, curveSegments: 18 }),
    new THREE.MeshStandardMaterial({ color: 0x0d0f12, metalness: 0.88, roughness: 0.32, envMapIntensity: 1.0 })
  );
  island.geometry.center();
  island.position.set(-W / 2 + 0.44, H / 2 - 0.44, -(D / 2 + 0.030));
  phone.add(island);

  var ringMat = new THREE.MeshStandardMaterial({ color: 0x24282d, metalness: 1, roughness: 0.20, envMapIntensity: 1.5 });
  var lensMat = new THREE.MeshPhysicalMaterial({ color: 0x05070c, metalness: 0.2, roughness: 0.05, clearcoat: 1, envMapIntensity: 2.4 });
  [[-0.13, 0.13], [0.13, -0.13]].forEach(function(p){
    var ring = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.135, 0.050, 36), ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.set(island.position.x + p[0], island.position.y + p[1], -(D / 2 + 0.058));
    phone.add(ring);
    var lens = new THREE.Mesh(new THREE.CylinderGeometry(0.097, 0.097, 0.054, 36), lensMat);
    lens.rotation.x = Math.PI / 2;
    lens.position.copy(ring.position); lens.position.z -= 0.006;
    phone.add(lens);
  });

  // ---------------------------------------------------------------- buttons
  // The extrude bevel widens the body past W/2, so buttons sitting at the
  // nominal edge get swallowed. Seat them from the bevelled outer face.
  var EDGE = W / 2 + 0.016;
  function sideButton(side, y, len){
    var b = new THREE.Mesh(
      new THREE.BoxGeometry(0.028, len, D * 0.62),
      new THREE.MeshStandardMaterial({ color: 0x1b1e22, metalness: 0.95, roughness: 0.22, envMapIntensity: 1.35 })
    );
    b.position.set(side * EDGE, y, 0);
    phone.add(b);
  }
  sideButton(-1,  0.62, 0.32);   // volume up
  sideButton(-1,  0.22, 0.32);   // volume down
  sideButton(-1,  1.06, 0.22);   // action
  sideButton( 1,  0.50, 0.56);   // power

  // ---------------------------------------------------------------- lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.28));
  var key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(3, 4, 5); scene.add(key);
  var fill = new THREE.DirectionalLight(0xbfc6ff, 0.5); fill.position.set(-4, 1, 3); scene.add(fill);
  var rim = new THREE.DirectionalLight(0x847dff, 1.1); rim.position.set(-2, -2, -5); scene.add(rim);

  // ---------------------------------------------------------------- rotation
  // Trackball, not yaw/pitch. The rotation axis is perpendicular to the drag
  // direction in screen space, so the phone turns whichever way you pull it
  // and never gimbal-locks at the poles.
  var dragging = false, last = null, vel = { x: 0, y: 0 }, spin = true, dist = 6.4;
  var tmpAxis = new THREE.Vector3(), tmpQ = new THREE.Quaternion();

  function rotateBy(dx, dy){
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 0.00001) return;
    tmpAxis.set(dy, dx, 0).normalize().applyQuaternion(camera.quaternion);
    tmpQ.setFromAxisAngle(tmpAxis, len * 0.005);
    phone.quaternion.premultiply(tmpQ);
  }

  function down(e){
    dragging = true; spin = false;
    stage.classList.add('drag');
    hideHint();
    last = point(e);
    if (e.pointerId !== undefined) stage.setPointerCapture(e.pointerId);
  }
  function move(e){
    if (!dragging) return;
    var p = point(e), dx = p.x - last.x, dy = p.y - last.y;
    rotateBy(dx, dy);
    vel.x = dx; vel.y = dy;
    last = p;
  }
  function up(){ dragging = false; stage.classList.remove('drag'); }
  function point(e){
    var t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }

  stage.addEventListener('pointerdown', down);
  stage.addEventListener('pointermove', move);
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('pointerleave', up);

  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    dist = Math.max(4.0, Math.min(11, dist + e.deltaY * 0.004));
  }, { passive: false });

  // pinch
  var pinch = null;
  stage.addEventListener('touchstart', function(e){
    if (e.touches.length === 2) pinch = gap(e);
  }, { passive: true });
  stage.addEventListener('touchmove', function(e){
    if (e.touches.length === 2 && pinch) {
      var g = gap(e);
      dist = Math.max(4.0, Math.min(11, dist * (pinch / g)));
      pinch = g;
    }
  }, { passive: true });
  stage.addEventListener('touchend', function(){ pinch = null; }, { passive: true });
  function gap(e){
    var a = e.touches[0], b = e.touches[1];
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }

  // ---------------------------------------------------------------- presets
  var target = null;
  function glideTo(q){ target = q.clone(); spin = false; hideHint(); }
  var e2q = function(x, y, z){
    return new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z, 'XYZ'));
  };
  document.getElementById('bFront').onclick = function(){ glideTo(e2q(0, 0, 0)); };
  document.getElementById('bBack').onclick  = function(){ glideTo(e2q(0, Math.PI, 0)); };
  document.getElementById('bTilt').onclick  = function(){ glideTo(e2q(-0.20, -0.52, 0.06)); };
  document.getElementById('bSpin').onclick  = function(){ spin = !spin; target = null; hideHint(); };

  var hint = document.getElementById('hint'), hinted = false;
  function hideHint(){ if (!hinted) { hinted = true; hint.classList.add('gone'); } }
  setTimeout(hideHint, 6000);

  // ---------------------------------------------------------------- loop
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) spin = false;

  function resize(){
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  phone.quaternion.copy(e2q(-0.16, -0.42, 0.05));

  function tick(){
    requestAnimationFrame(tick);

    if (target) {
      phone.quaternion.slerp(target, 0.12);
      if (phone.quaternion.angleTo(target) < 0.002) { phone.quaternion.copy(target); target = null; }
    } else if (!dragging) {
      if (Math.abs(vel.x) > 0.02 || Math.abs(vel.y) > 0.02) {
        rotateBy(vel.x, vel.y);            // inertia
        vel.x *= 0.94; vel.y *= 0.94;
      } else if (spin) {
        rotateBy(1.1, 0);                  // idle turntable
      }
    }

    camera.position.z += (dist - camera.position.z) * 0.12;
    renderer.render(scene, camera);
  }
  tick();
})();
</script>
</body>
</html>
